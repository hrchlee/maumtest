<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>마음 풍경 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 손 모바일 흐름 — 상단 고정 헤더, 질문 하나씩, 하단 고정 버튼. 각 테스트는 자기 풍경 그림을 가진다. */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --ink:#1C2430; --muted:#5B6470; --line:#D8DCD4;
  --accent:#2D5C8A; --accent-ink:#FFFFFF; --accent-soft:#E2EBF4;
  --scene-filter:none;
  --f-display:"Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151B; --surface:#1A2029; --ink:#E6E9ED; --muted:#9AA3AE; --line:#2B333D;
    --accent:#86B2DD; --accent-ink:#0D1620; --accent-soft:#1D2D3E;
    --scene-filter:brightness(.8) saturate(.9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --ink:#E6E9ED; --muted:#9AA3AE; --line:#2B333D;
  --accent:#86B2DD; --accent-ink:#0D1620; --accent-soft:#1D2D3E;
  --scene-filter:brightness(.8) saturate(.9); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:10px;min-height:56px;display:flex;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;line-height:1.3}
.brand-t{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.brand-s{font-size:.8rem;color:var(--muted)}
.back{border:0;background:none;padding:8px 10px 8px 0;font-size:.95rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:4px;min-height:44px}
.top-title{flex:1;min-width:0;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s ease}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px 132px}
.wrap.home{padding-block:20px 48px}
.lede{margin:0 0 18px;color:var(--muted);font-size:.95rem}

.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{width:100%;display:flex;gap:14px;align-items:stretch;text-align:left;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.card:active{transform:scale(.99)}
.thumb{flex:0 0 88px;height:76px;border-radius:9px;overflow:hidden;filter:var(--scene-filter)}
.thumb svg,.banner svg{display:block;width:100%;height:100%}
.card-b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-t{font-family:var(--f-display);font-weight:700;font-size:1.08rem}
.card-d{font-size:.88rem;color:var(--ink)}
.card-m{font-size:.78rem;color:var(--muted)}
.chip{font-size:.7rem;font-weight:600;letter-spacing:.02em;padding:2px 8px;border-radius:99px;border:1px solid var(--accent);color:var(--accent)}
.chip.done{background:var(--accent);color:var(--accent-ink)}
.note{margin:24px 0 0;font-size:.8rem;color:var(--muted);line-height:1.6}

.banner{height:132px;border-radius:14px;overflow:hidden;filter:var(--scene-filter)}
h1{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1.3;margin:20px 0 10px;text-wrap:balance}
.intro p{margin:0 0 10px}
.intro .sub{color:var(--muted);font-size:.92rem}

.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.08em;color:var(--accent);margin:4px 0 6px}
h2.q{font-family:var(--f-display);font-weight:700;font-size:1.4rem;line-height:1.4;margin:0 0 6px;text-wrap:balance}
.hint{margin:0 0 18px;color:var(--muted);font-size:.9rem}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;min-height:56px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:1rem;line-height:1.45}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mark{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"] .mark{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[aria-pressed="true"] .mark.chk::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.seq{margin:16px 0 0;font-size:.9rem;color:var(--muted);min-height:1.6em}
.seq b{color:var(--ink);font-weight:600}

.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:.85rem;font-weight:600}
.field input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.field input:focus{border-color:var(--accent);outline:none}

.actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.actions-in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:52px;border-radius:var(--r);font-weight:600;font-size:1rem;cursor:pointer;padding:0 18px}
.btn-primary{background:var(--accent);color:var(--accent-ink);border:0}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);flex:0 0 auto}
.btn-ghost.wide{flex:1}
.btn:disabled{opacity:.38;cursor:default}

.res-h{margin-top:20px}
.lead{background:var(--accent-soft);border-radius:14px;padding:18px;margin:16px 0}
.lead .sym{color:var(--accent)}
.big{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:2px 0 6px;line-height:1.35}
.lead p{margin:0}
.rank{list-style:none;padding:0;margin:8px 0 4px;display:grid;gap:8px}
.rank li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center}
.rank .n{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);text-align:right}
.rank .row{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.rank .row span:last-child{color:var(--muted)}
.rank .track{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.rank .track i{display:block;height:100%;background:var(--accent);border-radius:3px}
.items{list-style:none;padding:0;margin:8px 0 0}
.items li{padding:16px 0;border-top:1px solid var(--line)}
.sym{display:block;font-size:.76rem;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.ans{font-family:var(--f-display);font-weight:700;font-size:1.12rem;margin:0 0 4px}
.mean{margin:0}
.after{margin:16px 0 0;padding:14px 16px;border:1px dashed var(--line);border-radius:12px;font-size:.9rem;color:var(--muted)}
.sec-t{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:22px 0 4px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
const SCENES = {
desert:`<svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="120" fill="#F3D9AA"/><circle cx="318" cy="36" r="16" fill="#F2AE4B"/><path d="M0 80 Q90 54 180 76 T400 68 V120 H0Z" fill="#E1B26F"/><path d="M0 98 Q120 76 230 96 T400 92 V120 H0Z" fill="#C88E4E"/><g fill="#7A5634"><path d="M70 92h22v-6l6-4v10h3v6H70z"/><path d="M108 94h14v-4l4-3v7h2v4h-20z"/></g></svg>`,
pasture:`<svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="120" fill="#DCEAEE"/><circle cx="68" cy="34" r="15" fill="#F2CC63"/><path d="M0 78 Q110 54 220 72 T400 62 V120H0Z" fill="#AECF92"/><path d="M0 96 Q140 78 270 92 T400 88 V120H0Z" fill="#7BAA68"/><g stroke="#7A5B3A" stroke-width="3" stroke-linecap="round"><path d="M250 74v24M282 72v24M314 70v24M346 69v24"/><path d="M246 80L350 75M246 89L350 84"/></g></svg>`,
cube:`<svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="120" fill="#EADFCB"/><ellipse cx="72" cy="30" rx="48" ry="15" fill="#8D8794"/><ellipse cx="104" cy="24" rx="28" ry="11" fill="#A39DA9"/><g stroke="#8D8794" stroke-width="2" stroke-linecap="round"><path d="M44 46l-5 14M62 47l-5 14M80 46l-5 14M98 45l-5 14"/></g><path d="M0 92 Q150 76 400 88 V120H0Z" fill="#D6B482"/><path d="M196 58l24-12 24 12-24 12z" fill="#CFE2EE"/><path d="M196 58v26l24 12V70z" fill="#93B6CE"/><path d="M244 58v26l-24 12V70z" fill="#AECADD"/><g stroke="#7A5B3A" stroke-width="2.5" stroke-linecap="round"><path d="M256 96l12-48M270 96l12-48"/><path d="M258 88h14M260 78h14M263 68h14M265 58h14"/></g><g fill="#D9667A"><circle cx="176" cy="97" r="3"/><circle cx="167" cy="100" r="3"/><circle cx="184" cy="101" r="2.6"/></g></svg>`,

island:`<svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="120" fill="#D5E8F1"/><path d="M0 70h400v50H0z" fill="#5D9DC0"/><path d="M0 70h400v5H0z" fill="#7DB4D1"/><ellipse cx="150" cy="98" rx="90" ry="16" fill="#E6D2A1"/><path d="M152 94 Q148 68 160 46" stroke="#7A5B3A" stroke-width="5" fill="none" stroke-linecap="round"/><g fill="#4D8A55"><path d="M160 46 Q134 38 118 54 Q140 42 160 49Z"/><path d="M160 46 Q186 36 204 52 Q180 42 160 49Z"/><path d="M160 46 Q150 26 130 24 Q150 32 158 49Z"/><path d="M160 46 Q176 24 196 26 Q176 34 162 49Z"/></g><path d="M318 64h30l-6 7h-18z" fill="#4A4E58"/><path d="M332 64V47l11 15z" fill="#F4F4EF"/></svg>`
};

const O = (t,m)=>({t,m});

const TESTS = [
{ id:'desert', title:'사막의 다섯 동물', scene:'desert', time:'약 1분', blurb:'끝까지 놓지 않는 가치',
  intro:['당신은 양, 소, 말, 원숭이, 사자를 데리고 사막을 건너고 있습니다.','물과 식량이 점점 줄어들어 한 마리씩 떠나보내야 합니다. 오래 고민하지 말고 떠오르는 순서대로 고르세요.'],
  qs:[{id:'order',type:'order',drop:true,prompt:'어떤 순서로 떠나보내겠습니까?',hint:'가장 먼저 떠나보낼 동물부터 누르세요. 다시 누르면 취소됩니다.',
    items:[
      {k:'양',m:'사랑',d:'관계 속에서 힘을 얻는 사람입니다. 중요한 결정을 할 때도 가까운 사람의 마음을 먼저 떠올립니다.'},
      {k:'소',m:'일·직업',d:'일에서 의미와 보람을 찾습니다. 맡은 일을 끝까지 해내는 책임감이 큰 사람입니다.'},
      {k:'말',m:'가족',d:'가족이 삶의 중심입니다. 어디에 있든 돌아갈 곳을 지키는 일을 가장 중요하게 여깁니다.'},
      {k:'원숭이',m:'친구',d:'사람들과 어울리며 에너지를 얻습니다. 오래 함께한 친구가 큰 버팀목입니다.'},
      {k:'사자',m:'자존심',d:'스스로에 대한 기준과 자부심이 뚜렷합니다. 어떤 상황에서도 나다움을 잃지 않으려 합니다.'}]}],
  note:'마지막까지 남긴 동물이 지금 가장 놓기 싫은 가치입니다. 먼저 떠나보낸 동물은 덜 소중하다기보다, 어려울 때 가장 먼저 양보할 수 있는 영역에 가깝습니다.'},

{ id:'ranking', title:'초원의 동물 순위', scene:'pasture', time:'약 1분', blurb:'삶에서 앞에 두는 가치의 순서',
  intro:['넓은 초원에 소, 호랑이, 양, 말, 돼지가 있습니다.','마음이 가는 동물부터 순서대로 골라 주세요. 이유는 생각하지 않아도 됩니다.'],
  qs:[{id:'order',type:'order',drop:false,prompt:'좋아하는 순서대로 골라 주세요.',hint:'가장 좋아하는 동물부터 누르세요. 다시 누르면 취소됩니다.',
    items:[
      {k:'소',m:'일·직업',d:'일에서 의미와 보람을 찾습니다. 성실함으로 신뢰를 쌓는 사람입니다.'},
      {k:'호랑이',m:'자존심',d:'스스로에 대한 기준과 자부심이 뚜렷합니다. 인정받는 것보다 부끄럽지 않은 것을 더 중요하게 봅니다.'},
      {k:'양',m:'사랑',d:'관계 속에서 힘을 얻습니다. 사랑하는 사람과의 시간이 삶의 연료입니다.'},
      {k:'말',m:'가족',d:'가족이 삶의 중심입니다. 가족이 편안해야 나도 편안하다고 느낍니다.'},
      {k:'돼지',m:'돈',d:'경제적 안정과 여유를 중요하게 봅니다. 현실 감각이 좋고 미래를 미리 대비하는 편입니다.'}]}],
  note:'앞에 둔 동물일수록 지금 삶에서 우선순위가 높은 가치입니다. 몇 달 뒤에 다시 해 보면 순서가 바뀌기도 하는데, 그 변화 자체가 흥미로운 이야깃거리가 됩니다.'},

{ id:'cube', title:'사막의 큐브', scene:'cube', time:'약 3분', blurb:'자아, 친구, 연인, 아끼는 것, 걱정',
  intro:['눈을 감고 끝없는 사막을 떠올려 보세요.','그곳에 큐브 하나, 사다리, 말, 꽃, 그리고 폭풍이 있습니다. 처음 떠오른 장면을 그대로 고르는 것이 핵심입니다.'],
  qs:[
  {id:'size',type:'single',prompt:'큐브는 얼마나 큰가요?',sym:'큐브의 크기 = 자아의 크기, 자신감',opts:[
    O('손바닥만 하다','자신을 작고 겸손하게 봅니다. 스스로를 드러내기보다 상황을 살피는 편이고, 자신감이 필요한 순간 한발 물러설 때가 있습니다.'),
    O('사람 키 정도','자신을 현실적으로 인식합니다. 과하지도 부족하지도 않은 균형 잡힌 자기상입니다.'),
    O('집채만 하다','자신감이 크고 존재감이 있는 편입니다. 주변에서 당신을 든든하게 느낄 가능성이 큽니다.'),
    O('끝이 안 보일 만큼 거대하다','자아가 매우 크고 확고합니다. 추진력이 강한 만큼, 다른 사람의 의견이 들어올 틈을 의식적으로 남겨 두면 좋습니다.')]},
  {id:'material',type:'single',prompt:'큐브는 무엇으로 만들어져 있나요?',sym:'재질 = 마음을 드러내는 방식',opts:[

/* ---------- state ---------- */
const KEY='maum-tests-v1';
let state={answers:{},done:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.answers) state={answers:s.answers,done:s.done||{}};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

const $app=document.getElementById('app');
const byId=id=>TESTS.find(t=>t.id===id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ans=id=>state.answers[id]||(state.answers[id]={});
const visQs=t=>{const a=ans(t.id);return t.qs.filter(q=>!q.when||q.when(a));};
function isAnswered(q,v){
  if(v==null) return false;
  if(q.type==='single') return typeof v==='number';
  if(q.type==='order') return Array.isArray(v)&&v.length===q.items.length;
  if(q.type==='text') return String(v).trim().length>0;
  if(q.type==='fields') return q.fields.every(f=>v[f.id]&&String(v[f.id]).trim());
  return false;
}
function progressOf(t){const qs=visQs(t),a=ans(t.id);return qs.filter(q=>isAnswered(q,a[q.id])).length;}

let view={name:'home'};
let advanceTimer=null;

function go(v){
  clearTimeout(advanceTimer);
  view=v;
  const want=v.name==='home'?'':v.id;
  if(location.hash.slice(1)!==want){ if(want) location.hash=want; else history.replaceState(null,'',location.pathname+location.search); }
  render(); window.scrollTo(0,0);
}

/* ---------- views ---------- */
function topBar(backAct,backLabel,title,extra){
  return `<header class="top"><div class="top-in"><button class="back" data-act="${backAct}" aria-label="${backLabel}">‹ ${backLabel}</button><span class="top-title">${esc(title)}</span>${extra||''}</div>`;
}
function actions(btns){return `<div class="actions"><div class="actions-in">${btns}</div></div>`;}

function vHome(){
  const cards=TESTS.map(t=>{
    const n=visQs(t).length, p=progressOf(t);
    const chip=state.done[t.id]?'<span class="chip done">결과 있음</span>':(p>0?'<span class="chip">진행 중</span>':'');
    return `<li><button class="card" data-act="open" data-id="${t.id}"><div class="thumb">${SCENES[t.scene]}</div><div class="card-b"><div class="card-h"><span class="card-t">${t.title}</span>${chip}</div><span class="card-d">${t.blurb}</span><span class="card-m">질문 ${n}개 · ${t.time}</span></div></button></li>`;
  }).join('');
  return `<header class="top"><div class="top-in"><div class="brand"><span class="brand-t">마음 풍경</span><span class="brand-s">장면을 떠올리며 답하는 일곱 가지 테스트</span></div></div></header>
  <main class="wrap home"><p class="lede">장면을 상상하며 처음 떠오르는 답을 고르세요. 모든 질문에 답하고 ‘결과 보기’를 누르면 해석이 열립니다.</p>
  <ul class="list">${cards}</ul>
  <p class="note">이 테스트들은 대화를 여는 놀이입니다. 과학적으로 검증된 검사가 아니므로 채용이나 평가에는 쓰지 마세요. 답은 이 기기의 브라우저에만 저장됩니다.</p></main>`;
}

function vIntro(t){
  const p=progressOf(t), n=visQs(t).length, done=state.done[t.id];
  let btns;
  if(done) btns=`<button class="btn btn-ghost wide" data-act="restart">다시 하기</button><button class="btn btn-primary" data-act="result">결과 보기</button>`;
  else if(p>0) btns=`<button class="btn btn-ghost wide" data-act="restart">처음부터</button><button class="btn btn-primary" data-act="resume">이어서 하기</button>`;
  else btns=`<button class="btn btn-primary" data-act="resume">시작하기</button>`;
  return topBar('home','목록',t.title)+`</header>
  <main class="wrap intro"><div class="banner">${SCENES[t.scene]}</div><h1>${t.title}</h1>${t.intro.map((x,i)=>`<p class="${i?'sub':''}">${x}</p>`).join('')}<p class="sub">질문 ${n}개 · ${t.time}</p></main>`+actions(btns);
}

function vQuestion(t,i){
  const qs=visQs(t), q=qs[i], a=ans(t.id), v=a[q.id], last=i===qs.length-1;
  let body='';
  if(q.type==='single'){
    body=`<div class="opts" role="radiogroup">${q.opts.map((o,k)=>`<button class="opt" role="radio" aria-checked="${v===k}" aria-pressed="${v===k}" data-act="pick" data-k="${k}"><span class="mark chk"></span><span>${o.t}</span></button>`).join('')}</div>`;
  } else if(q.type==='order'){
    const arr=Array.isArray(v)?v:[];
    body=`<div class="opts">${q.items.map(it=>{const pos=arr.indexOf(it.k);return `<button class="opt" aria-pressed="${pos>=0}" data-act="order" data-k="${it.k}"><span class="mark">${pos>=0?pos+1:''}</span><span>${it.k}</span></button>`;}).join('')}</div>
    <p class="seq">${arr.length?`순서: <b>${arr.join(' → ')}</b>`:'아직 고르지 않았습니다.'}</p>`;
  } else if(q.type==='text'){
    body=`<div class="field"><label for="f-${t.id}-${q.id}">답</label><input id="f-${t.id}-${q.id}" type="text" maxlength="40" data-field="" placeholder="${q.ph}" value="${esc(v||'')}" autocomplete="off"></div>`;
  } else if(q.type==='fields'){
    const o=v||{};
    body=q.fields.map(f=>`<div class="field"><label for="f-${t.id}-${q.id}-${f.id}">${f.label}</label><input id="f-${t.id}-${q.id}-${f.id}" type="text" maxlength="40" data-field="${f.id}" placeholder="예: ${f.ph}" value="${esc(o[f.id]||'')}" autocomplete="off"></div>`).join('');
  }
  const pct=Math.round((i+1)/qs.length*100);
  return topBar('prev','이전',t.title,`<span class="count">${i+1} / ${qs.length}</span>`)+`<div class="prog"><i style="width:${pct}%"></i></div></header>
  <main class="wrap"><p class="eyebrow">질문 ${i+1}</p><h2 class="q">${q.prompt}</h2>${q.hint?`<p class="hint">${q.hint}</p>`:'<p class="hint"></p>'}${body}</main>`+
  actions(`${i>0?'<button class="btn btn-ghost" data-act="prev">이전</button>':''}<button class="btn btn-primary" id="nextBtn" data-act="next" ${isAnswered(q,v)?'':'disabled'}>${last?'결과 보기':'다음'}</button>`);
}

function buildResult(t){
  const a=ans(t.id); let html='', txt=[`[${t.title}]`];
  const items=[];
  visQs(t).forEach(q=>{
    const v=a[q.id];
    if(q.type==='order'){
      const order=q.drop?[...v].reverse():[...v];
      const it=k=>q.items.find(x=>x.k===k);
      const top=it(order[0]), low=it(order[order.length-1]);
      html+=`<div class="lead"><span class="sym">가장 소중한 가치</span><p class="big">${top.m}</p><p>${top.k}를 ${q.drop?'마지막까지 남겼습니다':'가장 먼저 골랐습니다'}. ${top.d}</p></div>
      <p class="sec-t">가치의 순서</p><ol class="rank">${order.map((k,n)=>{const x=it(k);return `<li><span class="n">${n+1}</span><div><div class="row"><span>${x.m}</span><span>${x.k}</span></div><div class="track"><i style="width:${(order.length-n)/order.length*100}%"></i></div></div></li>`;}).join('')}</ol>
      <ul class="items"><li><span class="sym">가장 먼저 내려놓을 수 있는 것</span><p class="ans">${low.m}</p><p class="mean">${low.k}${q.drop?'를 가장 먼저 떠나보냈습니다':'를 마지막에 골랐습니다'}. 어려운 상황에서 가장 먼저 양보하는 영역입니다. 덜 소중하다는 뜻이라기보다, 지금은 다른 가치가 앞선다는 뜻에 가깝습니다.</p></li></ul>`;
      txt.push(`가장 소중한 가치: ${top.m} (${top.k})`, `순서: ${order.map(k=>it(k).m).join(' > ')}`, `가장 먼저 내려놓을 수 있는 것: ${low.m} (${low.k})`);
    } else {
      let answer, mean;
      if(q.type==='single'){answer=q.opts[v].t; mean=q.opts[v].m;}
      else if(q.type==='text'){answer=String(v).trim(); mean=q.res(answer);}
      else {const o={}; q.fields.forEach(f=>o[f.id]=String(v[f.id]).trim()); answer=`${o.name} · ${o.why}`; mean=q.res(o);}
      items.push(`<li><span class="sym">${q.sym}</span><p class="ans">${esc(answer)}</p><p class="mean">${esc(mean)}</p></li>`);
      txt.push(`· ${q.sym}\n  내 답: ${answer}\n  ${mean}`);
    }
  });
  if(items.length) html+=`<ul class="items">${items.join('')}</ul>`;
  html+=`<p class="after">${t.note}</p>`;
  txt.push('', t.note, '※ 재미로 보는 비유 테스트입니다.');
  return {html, text:txt.join('\n')};
}

function vResult(t){
  const r=buildResult(t);
  return topBar('home','목록',t.title)+`</header>
  <main class="wrap"><div class="banner">${SCENES[t.scene]}</div><h1 class="res-h">${t.title} 해석</h1>${r.html}</main>`+
  actions(`<button class="btn btn-ghost wide" data-act="restart">다시 하기</button><button class="btn btn-primary" data-act="copy">결과 복사</button>`);
}

function render(){
  const t=view.id?byId(view.id):null;
  if(view.name==='home'||!t) $app.innerHTML=vHome();
  else if(view.name==='intro') $app.innerHTML=vIntro(t);
  else if(view.name==='q') $app.innerHTML=vQuestion(t,view.i);
  else if(view.name==='result') $app.innerHTML=vResult(t);
}

/* ---------- events ---------- */
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,1800);}
function firstOpen(t){const qs=visQs(t),a=ans(t.id);const k=qs.findIndex(q=>!isAnswered(q,a[q.id]));return k<0?qs.length-1:k;}

function next(){
  const t=byId(view.id), qs=visQs(t), q=qs[view.i];
  if(!isAnswered(q,ans(t.id)[q.id])) return;
  if(view.i>=qs.length-1){
    const miss=qs.findIndex(x=>!isAnswered(x,ans(t.id)[x.id]));
    if(miss>=0){toast('답하지 않은 질문이 있습니다.');go({name:'q',id:t.id,i:miss});return;}
    state.done[t.id]=true; save(); go({name:'result',id:t.id});
  } else go({name:'q',id:t.id,i:view.i+1});
}

$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, t=view.id?byId(view.id):null;
  if(act==='home') return go({name:'home'});
  if(act==='open') return go({name:'intro',id:b.dataset.id});
  if(act==='resume') return go({name:'q',id:t.id,i:firstOpen(t)});
  if(act==='restart'){state.answers[t.id]={};delete state.done[t.id];save();return go({name:'q',id:t.id,i:0});}
  if(act==='result') return go({name:'result',id:t.id});
  if(act==='prev') return view.i>0?go({name:'q',id:t.id,i:view.i-1}):go({name:'intro',id:t.id});
  if(act==='next') return next();
  if(act==='pick'){
    const q=visQs(t)[view.i]; ans(t.id)[q.id]=+b.dataset.k; delete state.done[t.id]; save();
    const cur=view; render();
    const qs=visQs(t);
    if(view.i<qs.length-1){clearTimeout(advanceTimer);advanceTimer=setTimeout(()=>{if(view===cur) go({name:'q',id:t.id,i:view.i+1});},260);}
    return;
  }
  if(act==='order'){
    const q=visQs(t)[view.i], a=ans(t.id); let arr=Array.isArray(a[q.id])?[...a[q.id]]:[];
    const k=b.dataset.k; arr=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k];
    a[q.id]=arr; delete state.done[t.id]; save(); render(); return;
  }
  if(act==='copy'){
    const text=buildResult(t).text;
    const fallback=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();toast(ok?'결과를 복사했습니다.':'복사하지 못했습니다. 화면을 길게 눌러 복사해 주세요.');};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>toast('결과를 복사했습니다.'),fallback);
    else fallback();
  }
});

$app.addEventListener('input',e=>{
  const el=e.target; if(!el.matches('[data-field]')) return;
  const t=byId(view.id), q=visQs(t)[view.i], a=ans(t.id);
  if(q.type==='text') a[q.id]=el.value;
  else {a[q.id]=Object.assign({},a[q.id]||{}); a[q.id][el.dataset.field]=el.value;}
  delete state.done[t.id]; save();
  const nb=document.getElementById('nextBtn'); if(nb) nb.disabled=!isAnswered(q,a[q.id]);
});
$app.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('[data-field]')){
    const all=[...$app.querySelectorAll('[data-field]')], k=all.indexOf(e.target);
    if(k<all.length-1) all[k+1].focus(); else {e.target.blur(); next();}
  }
});

function fromHash(){
  const id=location.hash.slice(1);
  if(id&&byId(id)){ if(view.id!==id) {view={name:'intro',id};render();window.scrollTo(0,0);} }
  else if(view.name!=='home'){view={name:'home'};render();window.scrollTo(0,0);}
}
window.addEventListener('hashchange',fromHash);
const h=location.hash.slice(1);
if(h&&byId(h)) view={name:'intro',id:h};
render();
</script>

</body>
